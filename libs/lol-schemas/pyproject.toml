[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lol-schemas"
version = "0.1.0"
description = "Canonical Pydantic v2 DTOs for LeagueOfLeagues (the ONE canonical Python type source)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "LeagueOfLeagues" }]
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lol_schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lol_schemas"]
mypy_path = "src"
