<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgonCup — League of Legends tournaments from Discord</title>
    <meta
      name="description"
      content="Run your League of Legends tournaments — the AgonCup admin console for brackets, teams, results, and disputes."
    />
    <meta name="theme-color" content="#010a13" />

    <!-- Icons: the desktop app's icon (services/desktop/build/icon.svg), rendered
         into public/ by `npm run icons` in services/desktop. Safari ignores SVG
         favicons and takes the .ico (sizes="32x32" keeps Chrome on the SVG);
         bump ?v= whenever the files change — browsers cache favicons for ages. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AgonCup — Tournament Operations Console" />
    <meta
      property="og:description"
      content="Run your League of Legends tournaments — brackets, teams, results, and disputes in one console."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgonCup — Tournament Operations Console" />
    <meta
      name="twitter:description"
      content="Run your League of Legends tournaments — brackets, teams, results, and disputes in one console."
    />
    <meta name="twitter:image" content="/og-image.png" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
