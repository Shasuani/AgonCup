# electron-builder packaging config for the LeagueOfLeagues desktop client.
# (PLAN.md §3.3 desktop client; CI workflow .github/workflows/desktop-build.yml.)
#
# Targets macOS (.dmg) + Windows (.exe / NSIS). Output lands in `release/` so it
# does NOT collide with the TypeScript `dist/` (tsc rootDir output) and matches
# the CI artifact glob (services/desktop/release/**).
#
# AUTO-UPDATE: `publish` below is what makes electron-builder write latest.yml
# (Windows) and latest-mac.yml (macOS) next to the installers, and bake an
# app-update.yml into the app so electron-updater knows the feed. The feed is a
# plain directory on the site — https://lol.gameras.gr/downloads/ — filled by
# infra/publish-desktop.sh. Nothing is ever uploaded BY electron-builder (the
# `dist` scripts pass --publish never); the generic provider is read-only.
# See src/updater.ts for what each platform does with the feed.
#
# SIGNING is driven entirely by CI env / secrets — there is NOTHING secret in
# this file:
#   - macOS:   electron-builder reads CSC_LINK (base64 .p12) + CSC_KEY_PASSWORD
#              for the Developer ID cert, and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD
#              / APPLE_TEAM_ID for notarization. When absent, CI sets
#              CSC_IDENTITY_AUTO_DISCOVERY=false and an UNSIGNED dev .dmg is built.
#   - Windows: electron-builder reads CSC_LINK (base64 .pfx) + CSC_KEY_PASSWORD;
#              absent => an UNSIGNED dev installer.
# The LCU-write ToS spike [BETA-GATE] (docs/compliance-checklist.md) remains the
# gate before any SIGNED client ships.

appId: gg.leagueofleagues.desktop
productName: LeagueOfLeagues
copyright: Copyright © LeagueOfLeagues

directories:
  output: release
  buildResources: build

# Ship the compiled JS + production deps only (no src / tests).
files:
  - "dist/**/*"
  - "dist-renderer/**/*"
  - "static/**/*"
  - "package.json"
  - "!**/*.map"
  - "!**/*.test.*"

# Don't reach the network for an electron download description at config-eval.
electronLanguages:
  - en-US

# The update feed (read-only generic provider; see the header). The URL must
# match the /downloads/ route the edge Caddy serves — .gitlab-ci.yml site block.
publish:
  - provider: generic
    url: https://lol.gameras.gr/downloads

mac:
  category: public.app-category.utilities
  # ONE universal .dmg (Intel + Apple Silicon) instead of one per arch: the
  # website gets a single "Download for Mac" button and no player has to know
  # which chip they have. The zip is what latest-mac.yml describes (Squirrel.Mac
  # updates from a zip, never a dmg); it is NOT uploaded while the build is
  # unsigned — src/updater.ts only checks the feed on macOS.
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Hardened runtime is required for notarization; entitlements live under build/.
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  writeUpdateInfo: false

# Notarization runs only when the APPLE_* env vars are present (CI gates this).
afterSign: null

win:
  target:
    - target: nsis
      arch:
        - x64
  # No spaces (electron-builder's default is "Name Setup 1.0.0.exe"): this name
  # goes into latest.yml and into URLs.
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Linux is not a shipped target (the client must reach the native League client);
# kept out intentionally.
