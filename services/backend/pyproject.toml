[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lol-backend"
version = "0.1.0"
description = "LeagueOfLeagues backend API (FastAPI) — tournaments, accounts, orchestration, results."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "LeagueOfLeagues" }]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.1",
    "python-json-logger>=2.0",
    "prometheus-client>=0.20",
    # Path deps on shared libraries (resolved via [tool.uv.sources] below).
    "lol-schemas",
    "lol-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

# uv path/editable sources for the shared libs. These map the dist names declared
# in [project.dependencies] to the sibling library packages in the monorepo.
# See PLAN.md §4 (repo structure) and §5 (shared libs).
[tool.uv.sources]
lol-schemas = { path = "../../libs/lol-schemas", editable = true }
lol-core = { path = "../../libs/lol-core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# Generated/third-party modules without complete stubs.
module = ["asyncpg.*", "pythonjsonlogger.*"]
ignore_missing_imports = true
