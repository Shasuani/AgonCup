[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lol-core"
version = "0.1.0"
description = "Domain enums, business rules, bracket engine, and result adjudication for LeagueOfLeagues. No web framework."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "LeagueOfLeagues" }]
dependencies = [
    "lol-schemas",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

# uv resolves the inter-package path dependency from here (no central workspace).
[tool.uv.sources]
lol-schemas = { path = "../lol-schemas", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/lol_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lol_core"]
mypy_path = "src"
