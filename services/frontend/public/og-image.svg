<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LeagueOfLeagues — Tournament Operations Console. Run your League of Legends tournaments.">
  <title>LeagueOfLeagues — Tournament Operations Console</title>
  <defs>
    <!-- Cobalt brand background gradient (bg -> surface, with cobalt bloom) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0b0f"/>
      <stop offset="0.55" stop-color="#111319"/>
      <stop offset="1" stop-color="#0a0b0f"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(940 120) rotate(135) scale(640 640)">
      <stop offset="0" stop-color="#6d5cf6" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#6d5cf6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6d5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(140 600) rotate(-45) scale(520 520)">
      <stop offset="0" stop-color="#8b7dff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b7dff" stop-opacity="0"/>
    </radialGradient>
    <!-- Logo mark: the app icon's own defs (services/desktop/build/icon.svg),
         ids prefixed ic so they cannot collide with the card's -->
    <linearGradient id="icBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162b4c"/>
      <stop offset="0.5" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#020b15"/>
    </linearGradient>
    <radialGradient id="icBloom" cx="0.5" cy="0.08" r="0.8">
      <stop offset="0" stop-color="#c8aa6e" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#c8aa6e" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#c8aa6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c98c"/>
      <stop offset="0.5" stop-color="#785a28"/>
      <stop offset="1" stop-color="#c8aa6e"/>
    </linearGradient>
    <linearGradient id="icGold" gradientUnits="userSpaceOnUse" x1="4" y1="2" x2="28" y2="30">
      <stop offset="0" stop-color="#f0e6d2"/>
      <stop offset="0.5" stop-color="#e2c98c"/>
      <stop offset="1" stop-color="#c8aa6e"/>
    </linearGradient>
    <linearGradient id="icHex" gradientUnits="userSpaceOnUse" x1="16" y1="2.5" x2="16" y2="29.5">
      <stop offset="0" stop-color="#11243c"/>
      <stop offset="1" stop-color="#040d1a"/>
    </linearGradient>
    <clipPath id="icTile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="icGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eaf0"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>
  <rect width="1200" height="630" fill="url(#bloom2)"/>

  <!-- Subtle bracket-grid motif (right side) — evokes a tournament bracket -->
  <g stroke="#272b36" stroke-width="2" fill="none" opacity="0.55">
    <path d="M812 150 h44 v60 h44"/>
    <path d="M812 270 h44 v-60"/>
    <path d="M812 360 h44 v60 h44"/>
    <path d="M812 480 h44 v-60"/>
    <path d="M944 210 h44 v120 h44"/>
    <path d="M944 420 h44 v-120"/>
    <path d="M1032 330 h60"/>
  </g>
  <g fill="#191c24" stroke="#272b36" stroke-width="2" opacity="0.7">
    <rect x="760" y="138" width="52" height="24" rx="6"/>
    <rect x="760" y="198" width="52" height="24" rx="6"/>
    <rect x="760" y="348" width="52" height="24" rx="6"/>
    <rect x="760" y="408" width="52" height="24" rx="6"/>
  </g>
  <g fill="#6d5cf6" opacity="0.85">
    <circle cx="1092" cy="330" r="6"/>
  </g>

  <!-- Hairline frame -->
  <rect x="0.5" y="0.5" width="1199" height="629" rx="0" stroke="#272b36" stroke-opacity="0.6"/>

  <!-- ===== Content block ===== -->
  <g transform="translate(96 200)">
    <!-- Logo mark: the desktop app icon (services/desktop/build/icon.svg — its
         824² tile at 120 px, without the macOS drop shadow), so the share card,
         the favicon and the client all carry ONE mark. Kept in sync by hand:
         icon.svg is the source of truth. -->
    <g transform="scale(0.1456311) translate(-100 -100)">
      <g clip-path="url(#icTile)">
        <rect x="100" y="100" width="824" height="824" fill="url(#icBase)"/>
        <rect x="100" y="100" width="824" height="824" fill="url(#icBloom)"/>
        <path d="M100 100H924V330L100 620Z" fill="#ffffff" opacity="0.03"/>
      </g>
      <rect x="114" y="114" width="796" height="796" rx="172" fill="none" stroke="url(#icFrame)" stroke-width="6" opacity="0.85"/>
      <rect x="130" y="130" width="764" height="764" rx="158" fill="none" stroke="#c8aa6e" stroke-width="2" opacity="0.22"/>
      <g transform="translate(512 512) scale(19.5) translate(-16 -16)">
        <path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25L16 2.5Z" fill="none" stroke="#c8aa6e" stroke-width="2.6" stroke-linejoin="round" opacity="0.45" filter="url(#icGlow)"/>
        <path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25L16 2.5Z" fill="url(#icHex)" stroke="url(#icGold)" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M11.5 10v12h4.5" fill="none" stroke="url(#icGold)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20.5 10v12" fill="none" stroke="#c8aa6e" stroke-width="2.1" stroke-linecap="round" opacity="0.5"/>
        <path d="M16 16h4.5" fill="none" stroke="url(#icGold)" stroke-width="2.1" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Wordmark -->
    <text x="152" y="44" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#wordmark)">LeagueOfLeagues</text>

    <!-- Eyebrow / category -->
    <text x="154" y="86" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace"
      font-size="20" font-weight="600" letter-spacing="3" fill="#8b7dff">TOURNAMENT OPERATIONS CONSOLE</text>

    <!-- Tagline (textLength locks width so fallback fonts never clip the OG card) -->
    <text x="0" y="186" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="44" font-weight="600" letter-spacing="-0.5" fill="#e8eaf0"
      textLength="760" lengthAdjust="spacingAndGlyphs">Run your League of Legends tournaments</text>
    <text x="0" y="232" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="24" font-weight="400" fill="#9ca2b2"
      textLength="820" lengthAdjust="spacingAndGlyphs">Autonomous custom-lobby orchestration · Discord-native · multi-tenant</text>
  </g>

  <!-- Accent baseline -->
  <rect x="96" y="540" width="1008" height="3" rx="1.5" fill="#6d5cf6" opacity="0.5"/>
</svg>
