# nginx config for the AgonCup admin SPA.
#
# Two jobs the default image does not do:
#  1) SPA fallback — client-side routes (/tournaments, /disputes, ...) must all
#     serve index.html, or a deep-link / refresh 404s.
#  2) Security headers — notably a Content-Security-Policy to shrink the XSS
#     surface (defense-in-depth for the in-memory-token model; PLAN.md §9, the
#     Phase-5 review's hardening recommendation).
#
# The CSP is intentionally strict: same-origin scripts only (no inline/eval).
# `connect-src` allows same-origin API calls — when the backend is a DIFFERENT
# origin, add it here (or, preferably, reverse-proxy /api through this server so
# it stays same-origin). `style-src 'unsafe-inline'` is required for React inline
# style attributes; tighten with hashes/nonces later if desired.
#
# `img-src` additionally allows cdn.discordapp.com: the server picker
# (screens/servers/ServersScreen) renders each Discord guild's own icon, and the
# backend hands us absolute cdn.discordapp.com URLs. It is an image-only origin —
# no script/connect privilege is granted by this.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- security headers (applied to every response) ----------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Long-cache hashed assets; never cache the HTML entrypoint.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every unknown path resolves to the app entrypoint.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
