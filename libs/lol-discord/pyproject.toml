[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lol-discord"
version = "0.0.0"
description = "Shared Discord helpers: embed builders + error formatting (Phase-0 skeleton)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AgonCup" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lol_discord"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lol_discord"]
mypy_path = "src"
