# Standalone mypy configuration for the AgonCup monorepo.
# Not a package; type-checks the src/ trees under libs/ and services/.
[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
show_error_codes = True
pretty = True
namespace_packages = True
explicit_package_bases = True

# Phase 0: third-party libs may lack stubs. Don't fail the whole run on those.
ignore_missing_imports = True

# Don't type-check generated, vendored, or build output.
exclude = (?x)(
    /\.venv/
    | /build/
    | /dist/
    | /node_modules/
    | /\.mypy_cache/
  )

# Tests are exercised by pytest; keep type strictness lighter there.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
