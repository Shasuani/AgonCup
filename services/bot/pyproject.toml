[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lol-bot"
version = "0.1.0"
description = "LeagueOfLeagues Discord bot (discord.py AutoShardedBot) — multi-tenant registration, tournament join, status."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "LeagueOfLeagues" }]

dependencies = [
    "discord.py>=2.4",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "python-json-logger>=2.0",
    # Service-auth calls to the backend (e.g. on_guild_remove → lifecycle purge).
    "httpx>=0.27",
    # Path deps on shared libraries (resolved via [tool.uv.sources] below).
    "lol-schemas",
    "lol-discord",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

# uv path/editable sources for the shared libs. See PLAN.md §4 / §5.
[tool.uv.sources]
lol-schemas = { path = "../../libs/lol-schemas", editable = true }
lol-discord = { path = "../../libs/lol-discord", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["discord.*", "pythonjsonlogger.*"]
ignore_missing_imports = true
