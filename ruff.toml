# Standalone ruff configuration for the LeagueOfLeagues monorepo.
# This file is NOT a Python package — it only configures the linter/formatter.
target-version = "py312"
line-length = 100
src = ["libs", "services"]

# Caches/build output that should never be linted.
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "node_modules",
    "*.bak",
]

[lint]
# A pragmatic, real-but-not-noisy rule set for Phase 0 scaffolding.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC",# flake8-async (asyncio correctness)
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by the formatter
]

[lint.per-file-ignores]
# Tests may use fixtures/assert patterns that trip some rules.
"**/tests/**" = ["B", "SIM"]

[lint.isort]
known-first-party = [
    "lol_core",
    "lol_schemas",
    "lol_riot",
    "lol_realtime",
    "lol_discord",
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
