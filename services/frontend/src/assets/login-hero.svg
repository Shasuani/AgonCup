<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" role="img" aria-label="Ambient tournament-bracket artwork in cobalt tones">
  <defs>
    <!-- Deep slate base, subtly top-lit -->
    <linearGradient id="lh-bg" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c0d13"/>
      <stop offset="0.5" stop-color="#0c0e14"/>
      <stop offset="1" stop-color="#0a0b0f"/>
    </linearGradient>
    <!-- Corner blooms (kept away from the centre so the card stays calm) -->
    <radialGradient id="lh-bloom1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(240 150) scale(620 620)">
      <stop offset="0" stop-color="#6d5cf6" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#6d5cf6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#6d5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lh-bloom2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1380 880) scale(640 640)">
      <stop offset="0" stop-color="#8b7dff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8b7dff" stop-opacity="0"/>
    </radialGradient>
    <!-- Cobalt stroke for the bracket connectors -->
    <linearGradient id="lh-line" x1="80" y1="200" x2="500" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a8dff"/>
      <stop offset="1" stop-color="#6d5cf6"/>
    </linearGradient>
    <!-- Centre vignette: a soft dark pool behind the auth card for contrast -->
    <radialGradient id="lh-vignette" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(800 500) scale(560 460)">
      <stop offset="0" stop-color="#08090c" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#08090c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#08090c" stop-opacity="0"/>
    </radialGradient>
    <!-- Faint dot grid -->
    <pattern id="lh-dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#2b3140"/>
    </pattern>

    <!-- One half-bracket; mirrored to the right via <use> for symmetry -->
    <g id="lh-bracket">
      <g stroke="url(#lh-line)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
        <path d="M96 250 H168 V320 H248"/>
        <path d="M96 390 H168 V320 H248"/>
        <path d="M96 610 H168 V680 H248"/>
        <path d="M96 750 H168 V680 H248"/>
        <path d="M248 320 H336 V500 H424"/>
        <path d="M248 680 H336 V500 H424"/>
        <path d="M424 500 H512"/>
      </g>
      <!-- seed nodes -->
      <g fill="#161922" stroke="#3a3f52" stroke-width="1.25">
        <rect x="78" y="232" width="18" height="18" rx="4" transform="rotate(45 87 241)"/>
        <rect x="78" y="372" width="18" height="18" rx="4" transform="rotate(45 87 381)"/>
        <rect x="78" y="592" width="18" height="18" rx="4" transform="rotate(45 87 601)"/>
        <rect x="78" y="732" width="18" height="18" rx="4" transform="rotate(45 87 741)"/>
      </g>
      <!-- junction nodes -->
      <g fill="#7e6ff8">
        <circle cx="168" cy="320" r="3.5"/>
        <circle cx="168" cy="680" r="3.5"/>
        <circle cx="336" cy="500" r="3.5"/>
        <circle cx="512" cy="500" r="4.5" fill="#b9b0ff"/>
      </g>
    </g>
  </defs>

  <!-- Base layers -->
  <rect width="1600" height="1000" fill="url(#lh-bg)"/>
  <rect width="1600" height="1000" fill="url(#lh-dots)" opacity="0.5"/>
  <rect width="1600" height="1000" fill="url(#lh-bloom1)"/>
  <rect width="1600" height="1000" fill="url(#lh-bloom2)"/>

  <!-- Symmetric bracket motifs framing the (empty) centre -->
  <use href="#lh-bracket"/>
  <use href="#lh-bracket" transform="translate(1600 0) scale(-1 1)"/>

  <!-- A few ambient hex particles, kept to the edges -->
  <g stroke="#6d5cf6" fill="none" opacity="0.2">
    <polygon points="300,120 318,130 318,150 300,160 282,150 282,130"/>
    <polygon points="1300,880 1318,890 1318,910 1300,920 1282,910 1282,890"/>
    <polygon points="1180,150 1194,158 1194,174 1180,182 1166,174 1166,158"/>
    <polygon points="420,860 434,868 434,884 420,892 406,884 406,868"/>
  </g>
  <g fill="#8b7dff" opacity="0.45">
    <circle cx="240" cy="150" r="1.6"/>
    <circle cx="1360" cy="880" r="1.6"/>
    <circle cx="700" cy="90" r="1.4"/>
    <circle cx="900" cy="920" r="1.4"/>
  </g>

  <!-- Soft dark pool behind the card -->
  <rect width="1600" height="1000" fill="url(#lh-vignette)"/>
</svg>
