# electron-builder packaging config for the LeagueOfLeagues desktop client.
# (PLAN.md §3.3 desktop client; built on a Mac with `npm run dist:all` and
# uploaded by hand to the server's downloads folder — docs/gitlab-cicd.md §9.)
#
# Targets macOS (.dmg) + Windows (.exe / NSIS). Output lands in `release/` so it
# does NOT collide with the TypeScript `dist/` (tsc rootDir output) and matches
# the CI artifact glob (services/desktop/release/**).
#
# AUTO-UPDATE: `publish` below is what makes electron-builder write latest.yml
# (Windows) and latest-mac.yml (macOS) next to the installers, and bake an
# app-update.yml into the app so electron-updater knows the feed. The feed is a
# plain directory on the site — https://lol.gameras.gr/downloads/ — that the
# owner fills by hand over SFTP (docs/gitlab-cicd.md §9). Nothing is ever
# uploaded BY electron-builder (the `dist` scripts pass --publish never); the
# generic provider is read-only. See src/update/ for what each platform does
# with the feed.
#
# FILE NAMES CARRY NO VERSION on purpose (artifactName below): every release
# overwrites the same five files on the server — LeagueOfLeagues-Setup.exe,
# LeagueOfLeagues.dmg, LeagueOfLeagues.zip, latest.yml, latest-mac.yml. The
# website's buttons, the feed files and the clients' manual-download fallback
# (src/update/installers.ts, app/desktop/service.py, the SPA's DownloadClient)
# all name the same files, so nothing has to be renamed or linked after an
# upload. The version lives INSIDE the files (latest*.yml, the installers'
# metadata), which is what the update check reads.
#
# SIGNING is driven entirely by CI env / secrets — there is NOTHING secret in
# this file:
#   - macOS:   electron-builder reads CSC_LINK (base64 .p12) + CSC_KEY_PASSWORD
#              for the Developer ID cert, and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD
#              / APPLE_TEAM_ID for notarization. When absent, CI sets
#              CSC_IDENTITY_AUTO_DISCOVERY=false and an UNSIGNED dev .dmg is built.
#   - Windows: electron-builder reads CSC_LINK (base64 .pfx) + CSC_KEY_PASSWORD;
#              absent => an UNSIGNED dev installer.
# The LCU-write ToS spike [BETA-GATE] (docs/compliance-checklist.md) remains the
# gate before any SIGNED client ships.

appId: gg.leagueofleagues.desktop
productName: LeagueOfLeagues
copyright: Copyright © LeagueOfLeagues

directories:
  output: release
  buildResources: build

# Ship the compiled JS + production deps only (no src / tests).
files:
  - "dist/**/*"
  - "dist-renderer/**/*"
  - "static/**/*"
  - "package.json"
  - "!**/*.map"
  - "!**/*.test.*"

# Don't reach the network for an electron download description at config-eval.
electronLanguages:
  - en-US

# The update feed (read-only generic provider; see the header). The URL must
# match the /downloads/ route the edge Caddy serves — .gitlab-ci.yml site block.
publish:
  - provider: generic
    url: https://lol.gameras.gr/downloads

mac:
  category: public.app-category.utilities
  # ONE universal .dmg (Intel + Apple Silicon) instead of one per arch: the
  # website gets a single "Download for Mac" button and no player has to know
  # which chip they have. The zip is what latest-mac.yml describes and what an
  # installed Mac client downloads to update itself (src/update/installers.ts
  # verifies its SHA-512 from the feed, unpacks it and swaps the bundle —
  # Squirrel.Mac would refuse an unsigned one).
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  # LeagueOfLeagues.dmg / LeagueOfLeagues.zip — see "FILE NAMES" in the header.
  artifactName: ${productName}.${ext}
  # Hardened runtime is required for notarization; entitlements live under build/.
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  writeUpdateInfo: false

# Notarization runs only when the APPLE_* env vars are present (CI gates this).
afterSign: null

win:
  target:
    - target: nsis
      arch:
        - x64
  # LeagueOfLeagues-Setup.exe — no spaces (electron-builder's default is
  # "Name Setup 1.0.0.exe"), no version (see "FILE NAMES" in the header). This
  # exact name goes into latest.yml and into the website's URL.
  artifactName: ${productName}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Linux is not a shipped target (the client must reach the native League client);
# kept out intentionally.
