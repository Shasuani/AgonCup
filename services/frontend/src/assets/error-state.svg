<svg width="240" height="180" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Something went wrong">
  <defs>
    <linearGradient id="err-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191c24"/>
      <stop offset="1" stop-color="#111319"/>
    </linearGradient>
  </defs>

  <!-- ambient glow (muted danger) -->
  <ellipse cx="120" cy="150" rx="86" ry="14" fill="#f87171" opacity="0.10"/>

  <!-- clipboard / report panel -->
  <rect x="48" y="26" width="144" height="124" rx="12" fill="url(#err-surface)" stroke="#272b36" stroke-width="1.5"/>

  <!-- clip at top -->
  <rect x="100" y="18" width="40" height="16" rx="6" fill="#191c24" stroke="#272b36" stroke-width="1.5"/>

  <!-- report lines, disrupted -->
  <line x1="66" y1="50" x2="138" y2="50" stroke="#272b36" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="66" y1="62" x2="118" y2="62" stroke="#272b36" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="66" y1="120" x2="138" y2="120" stroke="#272b36" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="66" y1="132" x2="106" y2="132" stroke="#272b36" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- alert badge (muted danger) -->
  <g transform="translate(120 92)">
    <circle r="22" fill="#f87171" opacity="0.12"/>
    <circle r="22" fill="none" stroke="#f87171" stroke-width="1.5" opacity="0.55"/>
    <line x1="0" y1="-9" x2="0" y2="4" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="12" r="2.25" fill="#f87171"/>
  </g>
</svg>
