<?xml version="1.0" encoding="UTF-8"?>
<!--
  AgonCup desktop app icon — SOURCE OF TRUTH.

  The mark is the renderer's BrandMark (renderer/icons.tsx; the web console's
  logo uses the same geometry): a solid "A" whose counter is a Panathenaic
  amphora — the prize cup of the ancient agon. The amphora is a real hole (an SVG
  mask: its handles are strokes), and its foot runs out of the bottom edge, which
  splits the A's two legs. Palette = the client's (renderer/theme.ts: gold
  #c8aa6e / #f0e6d2 / #785a28 on navy #0a1626 / #010a13).

  1024×1024 on Apple's icon grid: the rounded tile is 824×824 at (100,100) with
  transparent margins, as macOS expects. `scripts/make-icons.mjs` renders this
  file into build/icon.icns + icon.ico + icon.png (`npm run icons`); for Windows
  it crops the viewBox to the tile (full bleed) and drops the mac drop shadow.
  Elements marked class="fine" (hairlines, shadow) are stripped at 32 px and
  below, where they only add noise.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162b4c"/>
      <stop offset="0.5" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#020b15"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.08" r="0.8">
      <stop offset="0" stop-color="#c8aa6e" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#c8aa6e" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#c8aa6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c98c"/>
      <stop offset="0.5" stop-color="#785a28"/>
      <stop offset="1" stop-color="#c8aa6e"/>
    </linearGradient>
    <!-- userSpaceOnUse, in the mark's 100-grid -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="25" y1="8" x2="80" y2="92">
      <stop offset="0" stop-color="#f0e6d2"/>
      <stop offset="0.45" stop-color="#c8aa6e"/>
      <stop offset="1" stop-color="#785a28"/>
    </linearGradient>
    <!-- white = the A (a triangle, corners rounded by the stroke); black = the amphora hole -->
    <mask id="mark" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <path d="M50 12 87 85H13Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      <g transform="translate(19 35.18) scale(0.62)">
        <path d="M38 12H62V17H56V27C56 33 74 35 74 48C74 62 58 70 55 80L61 86H39L45 80C42 70 26 62 26 48C26 35 44 33 44 27V17H38Z" fill="#000"/>
        <path d="M56 19.5C72 13 79 30 68 37.5M44 19.5C28 13 21 30 32 37.5" fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="round"/>
      </g>
    </mask>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <!-- macOS-style soft drop shadow under the tile (outside the clip; mac only) -->
  <rect class="fine mac-shadow" x="104" y="116" width="816" height="816" rx="183" fill="#000" opacity="0.38" filter="url(#shadow)"/>

  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#base)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bloom)"/>
    <!-- faint diagonal sheen -->
    <path d="M100 100H924V330L100 620Z" fill="#ffffff" opacity="0.03"/>
  </g>

  <!-- frame: a gold hairline and a fainter inner line -->
  <rect class="fine" x="114" y="114" width="796" height="796" rx="172" fill="none" stroke="url(#frame)" stroke-width="6" opacity="0.85"/>
  <rect class="fine" x="130" y="130" width="764" height="764" rx="158" fill="none" stroke="#c8aa6e" stroke-width="2" opacity="0.22"/>

  <!-- the mark: BrandMark geometry (100-grid) scaled ×5.9; centred a little above
       the tile's middle, because a triangle's visual weight sits low -->
  <g transform="translate(512 484) scale(5.9) translate(-50 -48.5)">
    <rect width="100" height="100" fill="url(#gold)" mask="url(#mark)"/>
  </g>
</svg>
